name: Rust tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
      include-slow:
        description: Include tests marked with `#[ignore = "slow"]`.
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: opake-accounting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: ./.github/actions/setup-rust

      # No `--lib`: also run doc-tests so documented API examples cannot rot.
      - name: Run Rust tests
        run: cargo test --manifest-path packages/opake-accounting/Cargo.toml

      - name: Run slow Rust tests
        if: inputs.include-slow
        run: >-
          cargo test --manifest-path packages/opake-accounting/Cargo.toml
          --lib -- --ignored

# git-cliff configuration for Opake.
# Generates the "What's changed" section of draft GitHub Releases from
# Conventional Commit messages on main.
# See https://git-cliff.org/docs/configuration for all options.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
          {{ commit.message | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/JetBrains-Research/opake/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
    { message = "^feat",              group = "Added"         },
    { message = "^add",               group = "Added"         },
    { message = "^fix",               group = "Fixed"         },
    { message = "^refactor",          group = "Changed"       },
    { message = "^change",            group = "Changed"       },
    { message = "^perf",              group = "Changed"       },
    { message = "^deps",              group = "Changed"       },
    { message = "^docs",              group = "Documentation" },
    { message = "^test",              group = "Tests"         },
    { message = "^ci",                group = "CI/CD"         },
    { message = "^build",             group = "CI/CD"         },
    { message = "^chore",             skip = true             },
    { message = "^style",             skip = true             },
    { message = "^delete",            group = "Removed"       },
    { body = ".*BREAKING CHANGE",     group = "Breaking"      },
    { message = ".*!:",               group = "Breaking"      },
    { message = ".*",                 group = "Other"         },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ""
ignore_tags = "^v[0-9]+\\.[0-9]+\\.[0-9]+(?:-test|[.-]dev0)$"
topo_order = false
sort_commits = "oldest"

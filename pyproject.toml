[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque"
dynamic = ["version"]
description = "Functional Differential Privacy for PyTorch"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "differential-privacy",
    "dp-sgd",
    "dp-ftrl",
    "pytorch",
    "privacy",
    "machine-learning",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    # Build preflight rewrites these sentinel specs to exact synchronized wheel
    # pins for preview/release artifacts while local workspace installs continue
    # to resolve against the editable members below.
    "opaque-engine>=0.0.0.dev0",
    "opaque-accounting>=0.0.0.dev0",
    "opaque-dpsgd>=0.0.0.dev0",
    "opaque-optimizers>=0.0.0.dev0",
    "opaque-patches>=0.0.0.dev0",
]

[project.optional-dependencies]
auditing = ["opaque-auditing>=0.0.0.dev0"]
dpftrl = ["opaque-dpftrl>=0.0.0.dev0"]
federated = ["opaque-federated>=0.0.0.dev0"]
alignment = ["opaque-alignment>=0.0.0.dev0"]
transformers = [
    "opaque-transformers>=0.0.0.dev0",
    "opaque-patches[transformers]>=0.0.0.dev0",
]
trl = ["opaque-transformers[trl]>=0.0.0.dev0"]
all = [
    "opaque[auditing]",
    "opaque[dpftrl]",
    "opaque[federated]",
    "opaque[alignment]",
    "opaque[transformers]",
    "opaque[trl]",
]

# The ``opaque`` namespace is pure PEP 420, composed by whichever
# ``opaque-*`` sub-packages are installed alongside. The root distribution
# ships no Python code — it pins the curated sub-package bundle so
# ``pip install opaque`` resolves consistently.

[tool.setuptools]
# Suppress setuptools auto-discovery so it doesn't scan the workspace root
# and try to package ``packages/``, ``examples/``, ``docs/`` etc.
py-modules = []

[tool.setuptools.packages.find]
include = []
exclude = ["*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true
workspace.members = [
    "packages/opaque-base",
    "packages/opaque-engine",
    "packages/opaque-optimizers",
    "packages/opaque-dpsgd",
    "packages/opaque-dpftrl",
    "packages/opaque-auditing",
    "packages/opaque-transformers",
    "packages/opaque-accounting",
    "packages/opaque-patches",
    "packages/opaque-alignment",
    "packages/opaque-federated",
]

[tool.uv.sources]
opaque-base = { workspace = true }
opaque-engine = { workspace = true }
opaque-optimizers = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-dpftrl = { workspace = true }
opaque-auditing = { workspace = true }
opaque-transformers = { workspace = true }
opaque-accounting = { workspace = true }
opaque-patches = { workspace = true }
opaque-alignment = { workspace = true }
opaque-federated = { workspace = true }
# IFED ships from JetBrains' own index, not PyPI (where the names are
# dependency-confusion stubs).
ifed-sdk = { index = "jetbrains-fed" }
ifed-agent-abi = { index = "jetbrains-fed" }
ifed-server-abi = { index = "jetbrains-fed" }

[[tool.uv.index]]
name = "jetbrains-fed"
url = "https://packages.jetbrains.team/pypi/p/fed/python/simple/"
explicit = true

[dependency-groups]
# Developer tooling (test runner, linter, stats helpers, cross-validation
# against reference DP libs). Package runtime dependencies (torchopt,
# transformers, peft) live in each package's [dependencies] or
# [project.optional-dependencies] and compose via `--extra`. Triton is not
# explicitly declared — it is a platform-gated transitive dependency of
# `opaque-patches` kernels (only resolved on Linux x86_64) and auto-disabled
# when CUDA + Triton are not importable.
# Install with: `uv sync --group dev --all-packages --extra all`
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.5.0",   # Parallel test execution (`-n auto`); CI shards within each job
  "ruff>=0.16.0,<0.17",
  "setuptools>=68.0",     # Required by PyTorch's CPU dynamic-shape compiler
  "scipy>=1.11.0",         # Statistical tests
  # Cross-validation against reference DP accounting libraries. Imported by
  # packages/opaque-dpsgd/tests/accounting/test_cross_validation.py — not a
  # runtime dependency of opaque.
  "dp-accounting>=0.4.4",
  "riskcal>=1.2.0",
  # Reference implementation published with Feldman & Shenfeld. Imported by
  # test_cross_validation_allocation.py as a one-sided oracle: our PLD bound
  # must sit at or below its analytic bounds.
  "random-allocation>=1.0.5",
]

# Everything the scripts under examples/ and docs/tutorials/ need.
# Install with: `uv sync --group examples`
examples = [
  "torchopt>=0.7.3",          # DP-SGD/MF optimizer bindings used across examples
  "datasets>=2.0.0",          # HuggingFace datasets loader
  "numpy>=1.24",              # required by transformers 5 type annotations
  "transformers>=5.0.0,<6",  # v5 baseline includes supported Mellum/MoE models
  "peft>=0.13.0",             # LoRA adapters (needed by all training examples)
  "wandb>=0.16.0",            # Experiment tracking
  "jupyter>=1.0.0",           # Tutorial notebooks
  "matplotlib>=3.10.7",       # Tutorial plots
  "torchvision>=0.24.0",       # Vision example datasets
]

# Documentation building
# Install with: `uv sync --group docs`
docs = [
  "mkdocs>=1.5.0",
  "mike>=2.1.3",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-jupyter>=0.24.0",
]

[tool.pytest.ini_options]
# importlib mode gives each test file a unique module name based on its path,
# avoiding collisions when multiple packages share directory names (e.g.
# tests/noise/ in both opaque-dpsgd and opaque-dpftrl).
addopts = "--import-mode=importlib"

# Local test discovery walks the whole `packages/` tree — any package with a
# `tests/` directory is picked up automatically. CI uses grouped explicit
# package paths for parallelism and verifies that they cover every package test
# directory. Non-test directories are skipped by pytest's `test_*.py`
# convention.
#
testpaths = ["packages", "tests"]

markers = [
  "cuda: Test requires CUDA; auto-skipped on non-CUDA hosts.",
  "mps: Test requires Apple Metal (MPS); auto-skipped on non-MPS hosts.",
  "slow: Test takes >5 s on CPU; opted out in PR gate via `and not slow`, run on push to main.",
  "distributed: Test launches multiple CPU/Gloo ranks; selected by the Linux distributed gate.",
]

filterwarnings = [
  # PyTorch internals: SDPA has no vmap batching rule on CPU, so running
  # fused attention under vmap falls back to a slower path. Triggered by
  # design on CPU test runners; on CUDA the batching rule kicks in and no
  # warning fires.
  "ignore:There is a performance drop because we have not yet implemented the batching rule.*:UserWarning",
  # torchopt depends on torch.jit internals that upstream has deprecated in
  # favor of torch.compile / torch.export. Fires on import of torchopt; not
  # our code to change.
  "ignore:.*torch.jit.script_method. is deprecated.*:DeprecationWarning",
]

[tool.ruff]
# Shared lint/format settings for CI (`autoformat.yml`), `uv run ruff …`, and
# editor integrations. Select is explicit: Ruff 0.16 widened the unconfigured
# default far beyond what this repo wants as a merge gate.
target-version = "py311"  # inferred from requires-python (>=3.11,<3.14)
line-length = 88

# First-party source roots of the PEP 420 `opaque` namespace. Used by ruff to
# distinguish first- from third-party imports (import sorting / unresolved-import
# rules).
src = [
  "packages/opaque-accounting/src",
  "packages/opaque-alignment/src",
  "packages/opaque-auditing/src",
  "packages/opaque-base/src",
  "packages/opaque-dpftrl/src",
  "packages/opaque-dpsgd/src",
  "packages/opaque-engine/src",
  "packages/opaque-federated/src",
  "packages/opaque-optimizers/src",
  "packages/opaque-patches/src",
  "packages/opaque-transformers/src",
]

[tool.ruff.lint]
# High-signal rules. Omitted only when they fight intentional design or are a
# separate documentation/typing project — not merely because they need edits:
#   ARG    — unused-arg underscore renames break HF/torch keyword APIs
#            (create_graph=, batch_size=, prediction_loss_only=, vmap info/…)
#   PLC0415 — many lazy / optional / cycle-breaking imports are intentional
#   TRY003  — public semantic categories carry stable catch contracts without
#             a bespoke exception class per diagnostic message
#   ANN    — full annotation coverage is a separate initiative
#   RUF022  — alphabetical __all__ destroys thematic section comments
# Keep editor diagnostics aligned with the CI lint gate. Ruff still formats
# these excluded paths, while pytest and Qodana own their behavioral and
# semantic checks.
exclude = [
  ".github/scripts/**",
  "benchmarks/**",
  "conftest.py",
  "docs/**",
  "examples/**",
]
select = [
  "E", "F", "W",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C4",
  "PIE",
  "PERF",
  "FURB",
  "FA",
  "ICN",
  "PGH",
  "TRY003",
  "PT",
  "LOG",
  "SLOT",
  "FLY",
  "TC",   # move typing-only imports under TYPE_CHECKING
  "PTH",  # prefer pathlib over os.path
  "INP",  # flag missing __init__.py (tests + PEP 420 façades ignored below)
  "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  # Public API documentation. Keep the source-facing contract covered without
  # requiring prose for private implementation details or test helpers.
  "D100", "D101", "D103", "D104", "D417",
]
ignore = [
  "E501",   # formatter owns line length
  "RUF001", # intentional unicode in strings (math / en-dash)
  "RUF002", # intentional unicode in docstrings
  "RUF003", # intentional unicode in comments
  "RUF022", # keep thematic __all__ section comments
]

[tool.ruff.lint.isort]
known-first-party = ["opaque"]
# Keep force-single-line off; section comments in import blocks are rare —
# side-effect imports use an adjacent comment above the import line.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# These are implementation guardrails, not public API design constraints.
# Fourteen admits supported HF-compatible trainer signatures; public API shape
# remains a semantic review decision. Long trainer loops settle the statement
# ceiling at 120 while still rejecting monolithic configuration/validation code.
max-args = 14
max-positional-args = 14
max-statements = 120

[tool.ruff.lint.per-file-ignores]
# Optimizer / scheduler tests import after pytest.importorskip("torch"|"torchopt").
"packages/opaque-optimizers/tests/**" = ["E402"]
"packages/opaque-transformers/tests/opaque_transformers/test_scheduler_dispatch.py" = ["E402"]
# Triton launch/autograd signatures mirror fixed tensor/stride/shape contracts;
# grouping these arguments would obscure the kernel ABI rather than simplify it.
"packages/opaque-patches/src/opaque/api/patches/kernels/fused_add_rms_norm.py" = ["PLR0913", "PLR0917"]
"packages/opaque-patches/src/opaque/api/patches/kernels/fused_moe.py" = ["PLR0913", "PLR0917"]
"packages/opaque-patches/src/opaque/api/patches/kernels/linear_cross_entropy.py" = ["PLR0913", "PLR0917"]
"packages/opaque-patches/src/opaque/api/patches/kernels/lora.py" = ["PLR0913", "PLR0917"]
"packages/opaque-patches/src/opaque/api/patches/kernels/rms_norm.py" = ["PLR0913", "PLR0917"]
"packages/opaque-patches/src/opaque/api/patches/kernels/rope_embedding.py" = ["PLR0913", "PLR0917"]
# INP001: pytest trees intentionally omit __init__.py.
"**/tests/**" = ["INP001", "D", "PLR2004", "TRY003"]
"tests/**" = ["INP001", "D", "PLR2004", "TRY003"]
# Internal implementation methods are deliberately not selected by the
# public-surface rules above; test helpers remain outside this docstring scope.
# PEP 420: `opaque/` has no __init__.py (multi-wheel namespace); façade
# modules live directly under src/opaque/.
"packages/*/src/opaque/*.py" = ["INP001"]

name: Junie review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: junie-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Junie review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Junie code review
        uses: JetBrains/junie-github-action@8c442773960f53c76920978f485e0e25a66ef0fb # v1.7.10
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          junie_guidelines_filename: review-guidelines.md
          prompt: code-review
          use_single_comment: "true"

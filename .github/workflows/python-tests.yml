name: Python tests

on:
  workflow_call:
    inputs:
      allow-empty-test-selection:
        description: Treat an empty package selection as success.
        required: false
        default: false
        type: boolean
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
      dependency-selection:
        description: Dependency set to test (locked, minimum, or latest).
        required: false
        default: locked
        type: string
      environment-name:
        description: Stable environment identifier used in artifacts and Codecov flags.
        required: true
        type: string
      pytest-marker:
        description: pytest marker expression.
        required: true
        type: string
      pytest-xdist:
        description: pytest-xdist arguments; leave empty for serial execution.
        required: false
        default: ""
        type: string
      python-version:
        description: Python version used by each test-group matrix leg.
        required: false
        default: "3.11"
        type: string
      report-durations:
        description: Report every test phase taking at least five seconds.
        required: false
        default: false
        type: boolean
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      timeout-minutes:
        description: Maximum runtime for each test-group matrix leg.
        required: false
        default: 360
        type: number

jobs:
  test:
    name: ${{ matrix.suite.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      # A matrix keeps every caller's suites in one collapsible Actions block
      # without sacrificing the parallelism of the previous separate jobs.
      matrix:
        suite:
          - id: foundation
            label: Foundation
            paths: |
              packages/opake-base
              packages/opake-accounting
              packages/opake-auditing
          - id: dp-mechanisms
            label: DP mechanisms
            paths: |
              packages/opake-dpsgd
              packages/opake-dpftrl
          - id: runtime-and-patches
            label: Runtime and patches
            paths: |
              packages/opake-engine
              packages/opake-optimizers
              packages/opake-patches
          - id: alignment-and-transformers
            label: Alignment and transformers
            paths: |
              packages/opake-alignment
              packages/opake-transformers
          - id: integration
            label: Integration tests
            paths: tests
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-${{ matrix.suite.id }}
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
      TEST_RESULTS_FILE: .test-results-${{ inputs.environment-name }}-${{ matrix.suite.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - name: Verify package test matrix
        shell: bash
        run: |
          set -euo pipefail
          configured_paths="$(
            awk '
              /^[[:space:]]+packages\/[^[:space:]]+[[:space:]]*$/ {
                path = $0
                sub(/^[[:space:]]+/, "", path)
                sub(/[[:space:]]+$/, "", path)
                print path
              }
            ' .github/workflows/python-tests.yml
          )"
          missing_paths="$(
            comm -23 \
              <(find packages -mindepth 2 -maxdepth 2 -type d -name tests -exec dirname {} \; | sort -u) \
              <(printf '%s\n' "$configured_paths" | sort -u)
          )"
          if [[ -n "$missing_paths" ]]; then
            echo "::error::Package test directories missing from the Python test matrix:"
            printf '%s\n' "$missing_paths"
            exit 1
          fi
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      # A lane that only selects CUDA-marked tests must not be able to pass on a
      # host without CUDA: pytest skips those tests and exits 0, so the lane
      # would report green while validating nothing. The script is a no-op for
      # every marker expression that excludes CUDA.
      - name: CUDA preflight
        shell: bash
        run: bash .github/scripts/assert_cuda_available.sh
      - name: Run test group
        env:
          TEST_PATHS: ${{ matrix.suite.paths }}
        shell: bash
        run: |
          set -u
          failed=0
          while IFS= read -r test_path; do
            if [[ -z "$test_path" ]]; then
              continue
            fi
            if ! TEST_PATH="$test_path" bash .github/scripts/run_python_test_package.sh; then
              failed=1
            fi
          done <<< "$TEST_PATHS"
          exit "$failed"
      - uses: ./.github/actions/upload-python-coverage
        if: ${{ !cancelled() }}
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-${{ matrix.suite.id }}
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-${{ matrix.suite.id }}.xml
          codecov-flag: ${{ inputs.environment-name }}-${{ matrix.suite.id }}

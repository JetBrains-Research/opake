[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opake-patches"
dynamic = ["version"]
description = "Opake patches: PyTorch checkpoint shim and Hugging Face compatibility/kernel patches"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Opake Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "huggingface", "transformers", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.9.0",
    "opake-engine>=0.0.0.dev0",
]

[project.optional-dependencies]
transformers = [
  "transformers>=5.0.0,<6",
  "numpy>=1.24",
  "peft>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opake.patches*", "opake.api.patches*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opake-engine = { workspace = true }

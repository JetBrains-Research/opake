[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-dpftrl"
dynamic = ["version"]
description = "Opaque DP-FTRL mechanisms: matrix-factorization noise (BLT, BSR, BISR, lambda-CGD)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "dp-ftrl", "matrix-factorization", "pytorch", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.9.0",
    "scipy>=1.11.0",
    "opaque-engine>=0.0.0.dev0",
    "opaque-accounting>=0.0.0.dev0",
]

[project.optional-dependencies]
optimizers = ["opaque-optimizers>=0.0.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.dpftrl*", "opaque.api.dpftrl*", "opaque.api.accounting.dpftrl*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-accounting = { workspace = true }
opaque-optimizers = { workspace = true }

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opake-auditing"
dynamic = ["version"]
description = "Opake empirical privacy auditing: one-run estimator, coin-flip, membership inference"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Opake Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "privacy-auditing", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.9.0",
    "scipy>=1.11.0",
    "opake-engine>=0.0.0.dev0",
    "opake-accounting>=0.0.0.dev0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opake.auditing*", "opake.api.auditing*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opake-engine = { workspace = true }
opake-accounting = { workspace = true }

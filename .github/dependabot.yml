# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5
    groups:
      pipeline-dependencies:
        patterns:
          - "*"

  # Update Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/packages/opake-accounting"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5
    groups:
      accounting-dependencies:
        patterns:
          - "*"

  # Refresh the development workspace without changing library compatibility ranges.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 10
    groups:
      workspace-dependencies:
        patterns:
          - "*"
    versioning-strategy: "lockfile-only"

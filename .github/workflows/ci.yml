name: CI (main)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Rust tests
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust
    uses: ./.github/workflows/rust-tests.yml
    with:
      include-slow: true

  # ---------------------------------------------------------------------------
  # Python tests
  #
  # Main repeats every PR environment and includes slow tests in platform lanes.
  # Every environment gates distribution publishing.
  # ---------------------------------------------------------------------------
  python-tests-linux-amd64:
    name: Linux amd64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-amd64
      pytest-marker: not cuda and not mps and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 40

  python-tests-distributed:
    name: Linux amd64 (distributed)
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      environment-name: linux-distributed
      pytest-marker: distributed and not cuda
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 30

  python-tests-minimum:
    name: Linux amd64 (minimum dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: minimum
      environment-name: minimum-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 60

  python-tests-latest:
    name: Linux amd64 (latest dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.13"
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: mps
      pytest-marker: not cuda and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      timeout-minutes: 40

  python-tests-linux-arm64:
    name: Linux arm64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      timeout-minutes: 60

  python-tests-cuda:
    name: CUDA (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      environment-name: cuda
      pytest-marker: cuda
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 40

  python-tests-cuda-minimum:
    name: CUDA (minimum dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      dependency-selection: minimum
      environment-name: cuda-minimum-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.11"
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 60

  python-tests-cuda-latest:
    name: CUDA (latest dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      dependency-selection: latest
      environment-name: cuda-latest-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.13"
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 60

  qodana:
    name: Qodana
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    # Surface Qodana policy failures in its job while keeping main publication
    # independent from this informational analysis.
    continue-on-error: true
    needs:
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/run-qodana
        with:
          analyzed-sha: ${{ github.sha }}
          coverage-artifact-pattern: coverage-locked-*
          fail-on-problems: true
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dev wheel builds. Version derived from `setuptools-scm` + the preflight
  # script that writes the opake dep pins + Cargo workspace version.
  # Release builds live in release.yml (triggered on `v*` tag push).
  # ---------------------------------------------------------------------------
  build-distributions:
    name: Build
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-prefix: wheels
      retention-days: 30

  validate-distributions:
    name: Validate
    needs: [build-distributions]
    uses: ./.github/workflows/validate-distributions.yml
    with:
      artifact-prefix: wheels

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-distributions, validate-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 30

  publish-dev-wheels:
    name: Publish dev wheels to JetBrains Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - merge-wheels
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-minimum
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
      - python-tests-cuda-minimum
      - python-tests-cuda-latest
      - rust-tests
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-wheels
          path: dist/

      - name: List artifacts
        run: ls -lh dist/*.whl dist/*.tar.gz

      - uses: ./.github/actions/setup-python

      - name: Publish to JetBrains Packages
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/twine_upload.py upload \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            dist/*.whl dist/*.tar.gz

name: Validate distributions

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix used by distribution build artifacts.
        required: true
        type: string

jobs:
  install-all:
    name: opaque[all] (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: dist/
          merge-multiple: true

      - name: Install the IFED runtime from the JetBrains index
        run: |
          federated_wheels=(dist/opaque_federated-*.whl)
          if [[ "${#federated_wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one opaque-federated wheel, found ${#federated_wheels[@]}"
            exit 1
          fi
          mapfile -t ifed_requirements < <(
            unzip -p "${federated_wheels[0]}" '*.dist-info/METADATA' \
              | sed -n 's/^Requires-Dist: \(ifed-.*\)$/\1/p'
          )
          if [[ "${#ifed_requirements[@]}" -eq 0 ]]; then
            echo "::error::opaque-federated declares no ifed-* requirement"
            exit 1
          fi
          uv venv --python ${{ matrix.python-version }} .artifact-venv
          # IFED ships from JetBrains' own index; on PyPI these names are
          # dependency-confusion stubs. uv searches every --extra-index-url before
          # --index-url and keeps its first-index rule, so the ifed-* names resolve
          # here while every other name still comes from PyPI.
          uv pip install \
            --python .artifact-venv/bin/python \
            --index-url https://pypi.org/simple \
            --extra-index-url https://packages.jetbrains.team/pypi/p/fed/python/simple/ \
            --only-binary :all: \
            "${ifed_requirements[@]}"

      - name: Install opaque[all] from built wheels
        run: |
          opaque_wheels=(dist/opaque-*.whl)
          if [[ "${#opaque_wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one opaque wheel, found ${#opaque_wheels[@]}"
            exit 1
          fi
          uv pip install \
            --python .artifact-venv/bin/python \
            --find-links dist \
            --only-binary :all: \
            "${opaque_wheels[0]}[all]"

      - name: Run cross-stack scenario
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.artifact-venv/bin/python" - <<'PY'
          import math
          from importlib.metadata import distributions, version

          import opaque.dpftrl.accounting as dpftrl
          import opaque.dpsgd.accounting as dpsgd
          from opaque.dpftrl.noise import identity_strategy

          umbrella_version = version("opaque")
          opaque_versions = {
              dist.metadata["Name"]: dist.version
              for dist in distributions()
              if (name := dist.metadata["Name"]) == "opaque"
              or name.startswith("opaque-")
          }
          assert len(opaque_versions) > 1
          assert set(opaque_versions.values()) == {umbrella_version}, opaque_versions

          dpsgd_process = dpsgd.gaussian(1.0)
          dpftrl_process = dpftrl.poisson(
              dpftrl.mf_gaussian(1.0, identity_strategy()),
              sample_rate=0.01,
              n_steps=4,
          )
          epsilon = (dpsgd_process | dpftrl_process).epsilon_at(1e-5)
          assert math.isfinite(epsilon) and epsilon > 0
          print(f"opaque[all] cross-stack epsilon: {epsilon:.6f}")
          PY

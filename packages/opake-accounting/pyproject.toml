[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "opake-accounting"
version = "0.0.0.dev0"
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
license = { text = "Apache-2.0" }
license-files = []
requires-python = ">=3.11,<3.14"
authors = [{ name = "Opake Contributors" }]
keywords = ["differential-privacy", "privacy-loss-distribution", "pld"]
dependencies = [
    "opake-base>=0.0.0.dev0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[tool.uv]
package = true

[tool.uv.sources]
opake-base = { workspace = true }

[tool.maturin]
features = ["python-extension"]
module-name = "opake.api.accounting.core.opake_accounting"
python-source = "src"
python-packages = ["opake/accounting", "opake/api/accounting/core"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.maturin.target.aarch64-apple-darwin]
macos-deployment-target = "11.0"

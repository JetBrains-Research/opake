# yaml-language-server: $schema=https://json.schemastore.org/qodana-1.0.json

version: "1.0"
linter: qodana-python
withinDocker: "false"

profile:
  # The unpinned starter profile evolves with Qodana releases. The explicit
  # additions below are only semantic checks absent from that baseline.
  base:
    name: qodana.starter
  groups:
    - groupId: RuffOwned
      inspections:
        - PyBroadExceptionInspection
        - PyDefaultArgumentInspection
        - PyIncorrectDocstringInspection
        - PyMethodMayBeStaticInspection
        - PyPep8NamingInspection
        - PyProtectedMemberInspection
        - PyProtocolInspection
        - PyRedundantParenthesesInspection
        - PyShadowingBuiltinsInspection
        - PyShadowingNamesInspection
        - PySimplifyBooleanCheckInspection
        - PyStringConversionWithoutDunderMethodInspection
        - PyStringFormatInspection
        - PyTypeHintsInspection
        - PyUnnecessaryCastInspection
        - PyUnusedImportsInspection
        - PyUnusedLocalVariableInspection
        - PyUnusedParameterInspection
  inspections:
    - group: RuffOwned
      enabled: false
    - inspection: PyCoverageInspection
      # Per-entity coverage is noisy for the runtime categories that rely on
      # framework dispatch or functional state threading. Aggregate and fresh
      # coverage gates below continue to apply to every source file.
      ignore:
        - "scope#$Opake_DynamicFrameworkSources"
        - "scope#$Opake_FunctionalRuntimeSources"
        - "scope#$Opake_LazyModuleFacades"
    - inspection: PyArgumentListInspection
      enabled: true
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_FunctionalApiSignatures"
    - inspection: PyDataclassInspection
      enabled: true
      ignore:
        - "scope#$Opake_PythonTests"
    - inspection: PyTypeCheckerInspection
      enabled: true
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
        - "scope#$Opake_FunctionalRuntimeSources"
        - "scope#$Opake_GitHubScripts"
    - inspection: PyClassHasNoInitInspection
      # Qodana does not recognize generated dataclass constructors or extension
      # stubs. PyDataclassInspection remains enabled for real dataclass errors.
      enabled: false
    - inspection: PyAsyncCallInspection
      enabled: true
    - inspection: PyDictDuplicateKeysInspection
      enabled: true
    - inspection: PyInvalidCastInspection
      enabled: true
    - inspection: PyMockPatchArgumentCountInspection
      enabled: true
    - inspection: PyTestParametrizedInspection
      enabled: true
      ignore:
        - "scope#$Opake_PythonTests"
    - inspection: PyTestUnpassedFixtureInspection
      enabled: true
    - inspection: PyUnhashableInspection
      enabled: true
    - inspection: PyNoneFunctionAssignmentInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
    - inspection: PyUnboundLocalVariableInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
    - inspection: PyCallingNonCallableInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyMethodOverridingInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyUnreachableCodeInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyTypedDictInspection
      ignore:
        - "scope#$Opake_PythonTests"
    - inspection: PyDeprecationInspection
      ignore:
        - "scope#$Opake_PythonTests"
    - inspection: PyPropertyAccessInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyPropertyDefinitionInspection
      ignore:
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyPatternInspection
      ignore:
        - "scope#$Opake_FunctionalRuntimeSources"
    - inspection: PyDecoratorInspection
      ignore:
        - "scope#$Opake_DynamicFrameworkSources"
    - inspection: PyInconsistentReturnsInspection
      ignore:
        - "scope#$Opake_PythonTests"
        - "scope#$Opake_ExamplesAndTutorials"
        - "scope#$Opake_DynamicFrameworkSources"
        - "scope#$Opake_FunctionalRuntimeSources"
        - "scope#$Opake_GitHubScripts"
    - inspection: PyRedeclarationInspection
      ignore:
        - "scope#$Opake_FunctionalRuntimeSources"
# Qodana uses a starter-based bridge because its headless engine interprets
# several project-profile inspections differently from PyCharm. The shared
# category scopes describe stable analyzer limitations, not individual files.

# Sanity analysis uses a separate profile, so its inspection-specific
# analyzer workarounds must remain in Qodana's top-level configuration.
exclude:
  - name: All
    paths:
      - .github
  - name: PyUnresolvedReferencesInspection
    paths:
      - docs/tutorials
      - examples
      - packages/opake-accounting/tests
      - packages/opake-alignment/tests
      - packages/opake-auditing/tests
      - packages/opake-base/tests
      - packages/opake-dpftrl/tests
      - packages/opake-dpsgd/tests
      - packages/opake-engine/tests
      - packages/opake-jax/tests
      - packages/opake-mlx/tests
      - packages/opake-optimizers/tests
      - packages/opake-patches/tests
      - packages/opake-torch/tests
      - packages/opake-transformers/tests
      - tests
      - packages/opake-engine/src/opake/api/engine/clipping
      - packages/opake-engine/src/opake/api/engine/functional
      - packages/opake-engine/src/opake/api/engine/random
      - packages/opake-patches/src/opake/api/patches

# Resolve every workspace package so inspections, vulnerability checks, license
# audit, and SBOM generation see the same dependency graph as CI.
bootstrap: |
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
    export PATH="$HOME/.local/bin:$PATH"
  fi
  export XDG_CACHE_HOME="${XDG_CACHE_HOME:-/tmp/qodana-cache}"
  export UV_CACHE_DIR="${UV_CACHE_DIR:-$XDG_CACHE_HOME/uv}"
  if ! command -v cc >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential
  fi
  uv sync --frozen --group dev --all-packages --extra all
analyzeDevDependencies: true

include:
  - name: CheckDependencyLicenses
  - name: VulnerableLibrariesLocal

projectLicenses:
  - key: Apache-2.0
raiseLicenseProblems: true

coverage:
  reportProblems: true
  # Qodana's baseline records existing gaps while reporting newly introduced
  # uncovered locations for incremental cleanup.
  reportProblems: true
  codeCoverageLocations:
    - .qodana/code-coverage

failureConditions:
  severityThresholds:
    # The inspected policy is deliberately clean; any unsuppressed finding is
    # a CI failure rather than only critical-severity findings.
    any: 0
    critical: 0
  testCoverageThresholds:
    fresh: 80
    total: 75
  dependencyLicenses:
    failOnProhibited: true
    failOnUnknown: false

# Treat broken indexing or analysis as a failed check instead of a successful
# report with incomplete findings.
failOnErrorNotification: true

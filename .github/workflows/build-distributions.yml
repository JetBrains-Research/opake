name: Build distributions

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix for all uploaded build artifacts.
        required: true
        type: string
      checkout-ref:
        description: Ref to build. Leave empty to build the triggering SHA.
        required: false
        default: ""
        type: string
      retention-days:
        description: Number of days to retain uploaded artifacts.
        required: true
        type: number
      version:
        description: Explicit build version. Leave empty to derive it from git.
        required: false
        default: ""
        type: string

jobs:
  build-python-wheels:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build opake
        run: uv build . --wheel --out-dir dist

      - name: Build opake-base
        run: uv build packages/opake-base --wheel --out-dir dist

      - name: Build opake-engine
        run: uv build packages/opake-engine --wheel --out-dir dist

      - name: Build opake-optimizers
        run: uv build packages/opake-optimizers --wheel --out-dir dist

      - name: Build opake-dpsgd
        run: uv build packages/opake-dpsgd --wheel --out-dir dist

      - name: Build opake-dpftrl
        run: uv build packages/opake-dpftrl --wheel --out-dir dist

      - name: Build opake-auditing
        run: uv build packages/opake-auditing --wheel --out-dir dist

      - name: Build opake-patches
        run: uv build packages/opake-patches --wheel --out-dir dist

      - name: Build opake-transformers
        run: uv build packages/opake-transformers --wheel --out-dir dist

      - name: Build opake-alignment
        run: uv build packages/opake-alignment --wheel --out-dir dist

      - name: Validate wheel metadata
        run: >-
          uv run --isolated --no-project --with packaging==25.0
          python .github/scripts/check_wheel_internal_pins.py --wheel-dir dist

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-python
          path: dist/*.whl
          retention-days: ${{ inputs.retention-days }}

  build-native-artifacts:
    name: opake-accounting (${{ matrix.target.label }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - kind: wheel
            label: Linux x86_64
            artifact: linux-x86_64
            pattern: "*.whl"
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - kind: wheel
            label: Linux arm64
            artifact: linux-arm64
            pattern: "*.whl"
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - kind: wheel
            label: macOS arm64
            artifact: macos-arm64
            pattern: "*.whl"
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: off
          - kind: sdist
            label: sdist
            artifact: sdist
            pattern: "*.tar.gz"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - if: matrix.target.kind == 'wheel'
        uses: ./.github/actions/setup-rust

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build wheel
        if: matrix.target.kind == 'wheel'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          working-directory: packages/opake-accounting
          target: ${{ matrix.target.target }}
          manylinux: ${{ matrix.target.manylinux }}
          args: >-
            --release
            --interpreter python3.11
            --out ../../dist
            --compatibility pypi

      - name: Strip macOS native wheel symbols
        if: matrix.target.target == 'aarch64-apple-darwin'
        run: >-
          uv run --isolated --no-project --with wheel
          python .github/scripts/strip_macos_native_wheel.py dist/*.whl

      - name: Build sdist
        if: matrix.target.kind == 'sdist'
        run: uv build packages/opake-accounting --sdist --out-dir dist

      - name: Validate wheel metadata
        if: matrix.target.kind == 'wheel'
        run: >-
          uv run --isolated --no-project --with packaging==25.0
          python .github/scripts/check_wheel_internal_pins.py --wheel-dir dist

      - name: Import native extension from wheel
        if: matrix.target.kind == 'wheel'
        run: |
          wheels=(dist/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one wheel, found ${#wheels[@]}"
            exit 1
          fi
          python3 -m venv wheel-import
          wheel-import/bin/python -m pip install --no-deps "${wheels[0]}"
          wheel-import/bin/python - <<'PY'
          import ctypes
          from pathlib import Path

          native = next(Path("wheel-import").glob("**/opake_accounting.abi3.so"))
          ctypes.CDLL(str(native))
          PY

      - name: Validate artifact policy
        run: python3 .github/scripts/check_accounting_artifact_policy.py --wheel-dir dist

      - name: Rebuild wheel from sdist
        if: matrix.target.kind == 'sdist'
        run: |
          sdists=(dist/*.tar.gz)
          if [[ "${#sdists[@]}" -ne 1 ]]; then
            echo "::error::Expected one sdist, found ${#sdists[@]}"
            exit 1
          fi
          uv build "${sdists[0]}" --wheel --out-dir rebuilt

      - name: Validate rebuilt wheel artifact policy
        if: matrix.target.kind == 'sdist'
        run: python3 .github/scripts/check_accounting_artifact_policy.py --wheel-dir rebuilt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-opake-accounting-${{ matrix.target.artifact }}
          path: dist/${{ matrix.target.pattern }}
          retention-days: ${{ inputs.retention-days }}

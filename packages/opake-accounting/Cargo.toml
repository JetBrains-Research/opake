[package]
name = "opake-accounting"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
repository.workspace = true
keywords.workspace = true
rust-version = "1.83"
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.pyo",
]

[lib]
name = "opake_accounting"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"
statrs = "0.19"
realfft = "3.4"
rayon = "1.10"
rand = "0.10"
rand_distr = "0.6"
serde = { version = "1", features = ["derive"], optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"], optional = true }

[dev-dependencies]
approx = "0.5"

[features]
default = []
python-extension = ["pyo3"]
nightly = []

[lints]
workspace = true

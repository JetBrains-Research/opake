[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opake-optimizers"
dynamic = ["version"]
description = "Opake functional optimizers (torchopt-based, DP-aware update surface)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Opake Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "pytorch", "optimizers", "torchopt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# Depends on opake-engine (not opake-base) because optimizer state
# uses ClippedPytree / NoisedPytree / PerGroup, all of which live in
# opake.api.engine.types.
dependencies = [
    "opake-engine>=0.0.0.dev0",
    "torch>=2.9.0",
    "torchopt>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opake.api.optimizers*", "opake.optimizers*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opake-base"
dynamic = ["version"]
description = "Opake foundation: pure-Python serialization registry and dispatcher (the seam used by every other opake wheel)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Opake Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "serialization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# opake-base is intentionally torch-free. It ships only the pure-Python
# serialization registry + dispatcher that every other opake wheel
# registers handlers against. Adding any third-party dependency here
# would propagate into opake-accounting (the only standalone consumer
# besides opake-engine) and break the "torch-free accounting" guarantee.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["opake.api.base*", "opake.exceptions*", "opake.serialization*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

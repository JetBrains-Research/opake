name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: [ "enhancement", "triage" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? (Optional if it's a pure enhancement)
      placeholder: "I'm frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see
      placeholder: "I'd like to be able to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or features you've considered
      placeholder: "Another approach could be..."
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      description: What area does this feature belong to?
      options:
        - "Core DP-SGD (clipping, noise, accounting)"
        - "Optimizers (adaptive clipping, etc.)"
        - "Sampling (Poisson, microbatching)"
        - "LoRA integration"
        - "Documentation"
        - "Testing/validation"
        - "Performance optimization"
        - "API design"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (Your Perspective)
      description: How important is this feature to you?
      options:
        - "Critical - Blocking my work"
        - "High - Would significantly improve my workflow"
        - "Medium - Nice to have"
        - "Low - Minor improvement"
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Usage Example
      description: Show how you'd use this feature (pseudocode is fine)
      placeholder: |
        ```python
        # Example usage
        from opake import new_feature
        result = new_feature(...)
        ```
      render: python
    validations:
      required: false

  - type: textarea
    id: jax-privacy
    attributes:
      label: JAX-Privacy Comparison
      description: Does JAX-Privacy have this feature? If so, provide a link or description
      placeholder: "JAX-Privacy has..."
    validations:
      required: false

  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I'm willing to submit a PR for this feature
        - label: I'm willing to help test this feature
        - label: I'm willing to help write documentation

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, references, or relevant information
      placeholder: "Related papers, libraries, etc..."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and PRs to avoid duplicates
          required: true
        - label: I have checked the roadmap to see if this is already planned
          required: true

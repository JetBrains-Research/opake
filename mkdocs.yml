site_name: Opaque
site_description: Functional DP-SGD and DP-FTRL for PyTorch
site_author: Opaque Contributors
site_url: https://jetbrains-research.github.io/opaque/

repo_name: JetBrains-Research/opaque
repo_url: https://github.com/JetBrains-Research/opaque
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/opaque-base/src
            - packages/opaque-engine/src
            - packages/opaque-optimizers/src
            - packages/opaque-dpsgd/src
            - packages/opaque-dpftrl/src
            - packages/opaque-auditing/src
            - packages/opaque-accounting/src
            - packages/opaque-patches/src
            - packages/opaque-transformers/src
            - packages/opaque-alignment/src
            - packages/opaque-federated/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Overview: user-guide/index.md
    - Differential Privacy Concepts: user-guide/dp-concepts.md
    - Random Number Generation: user-guide/rng-key.md
    - End-to-end pipelines:
      - DP-SGD: user-guide/dp-sgd.md
      - DP-FTRL: user-guide/dp-ftrl.md
    - Per-Example Gradient Clipping: user-guide/clipping.md
    - Noise Addition: user-guide/noise.md
    - Mixed Precision: user-guide/precision.md
    - Privacy Accounting: user-guide/accounting.md
    - Sampling & Microbatching: user-guide/sampling.md
    - Optimizers: user-guide/optimizers.md
    - LR Scheduling: user-guide/lr-scheduling.md
    - Distributed Training: user-guide/distributed.md
    - HuggingFace Integration:
      - Overview: user-guide/huggingface/index.md
      - DPTrainer: user-guide/huggingface/dptrainer.md
      - Distributed DPTrainer: user-guide/distributed-trainer.md
      - TrainingArguments: user-guide/huggingface/training-arguments.md
      - Model Patches: user-guide/huggingface/model-patches.md
    - Memory Optimizations: user-guide/memory-optimizations.md
    - Privacy Auditing: user-guide/auditing.md
    - Known Limitations: limitations.md
  - Mechanisms:
    - Overview: mechanisms/index.md
    - DP-SGD:
      - Overview: mechanisms/dp-sgd/index.md
      - Gaussian: mechanisms/dp-sgd/gaussian.md
    - DP-FTRL:
      - Overview: mechanisms/dp-ftrl/index.md
      - BandMF: mechanisms/dp-ftrl/band-mf.md
      - BLT: mechanisms/dp-ftrl/blt.md
      - BSR: mechanisms/dp-ftrl/bsr.md
      - BISR: mechanisms/dp-ftrl/bisr.md
      - DP-λCGD: mechanisms/dp-ftrl/lambda-cgd.md
  - Alignment:
    - Overview: alignment/index.md
    - SFT: alignment/sft.md
    - DPO: alignment/dpo.md
    - SFT & DPO Trainers: alignment/trainers.md
  - Tutorials:
    - Overview: tutorials/README.md
    - DP-SGD track:
      - DP-SGD Training: tutorials/dp_sgd_training.ipynb
      - Accounting & Calibration: tutorials/accounting_and_calibration.ipynb
      - Sampling & Microbatching: tutorials/sampling_and_microbatching.ipynb
      - Fine-tuning an LLM: tutorials/llm_finetuning.ipynb
    - DP-FTRL track:
      - DP-FTRL Training: tutorials/dp_ftrl_training.ipynb
    - Cross-cutting:
      - Privacy Auditing: tutorials/privacy_auditing.ipynb
      - Distributed Training: tutorials/distributed_training.ipynb
  - Development:
    - Overview: development/index.md
  - API Reference:
    - Overview: reference/index.md
    - Exceptions: reference/exceptions.md
    - Serialization: reference/serialization.md
    - Clipping: reference/clipping.md
    - Noise: reference/noise.md
    - Accounting: reference/accounting.md
    - Sampling: reference/sampling.md
    - Federated: reference/federated.md
    - Random: reference/rng.md
    - Distributed: reference/distributed.md
    - Auditing: reference/auditing.md
    - Utilities: reference/utilities.md
    - Optimizers: reference/optimizers.md
    - Schedules: reference/schedules.md
    - Transformers: reference/transformers.md
    - Alignment: reference/alignment.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JetBrains-Research/opaque
  version:
    provider: mike

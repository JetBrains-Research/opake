[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opake-transformers"
dynamic = ["version"]
description = "Hugging Face trainer integration for Opake: DP-aware training loop, TRL-style SFT/DPO support, and Hugging Face compatibility layers."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Opake Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "differential-privacy",
    "huggingface",
    "transformers",
    "pytorch",
    "privacy",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "transformers>=5.0.0,<6",
    "peft>=0.13.0",
    "datasets>=2.0.0",
    "numpy>=1.24",
    "opake-engine>=0.0.0.dev0",
    "opake-patches>=0.0.0.dev0",
    "opake-dpsgd>=0.0.0.dev0",
    "opake-dpftrl>=0.0.0.dev0",
    "opake-accounting>=0.0.0.dev0",
    "opake-optimizers>=0.0.0.dev0",
    "opake-alignment>=0.0.0.dev0",
]

[project.optional-dependencies]
# Enables the ``opake.transformers.trl.SFTConfig.from_trl`` /
# ``DPOConfig.from_trl`` classmethods, which accept a real
# ``trl.SFTConfig`` / ``trl.DPOConfig`` instance and translate it into
# opake's equivalent. The opake trainers themselves do NOT require trl
# — they re-implement the TRL-shaped surface natively. This extra is
# only for users coming from existing TRL pipelines who want to convert
# their configs.
trl = ["trl>=1.0,<2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opake.transformers*", "opake.api.transformers*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0.dev0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opake-engine = { workspace = true }
opake-patches = { workspace = true }
opake-dpsgd = { workspace = true }
opake-dpftrl = { workspace = true }
opake-accounting = { workspace = true }
opake-optimizers = { workspace = true }
opake-alignment = { workspace = true }

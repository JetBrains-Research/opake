[workspace]
members = ["packages/opake-accounting"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Opake Contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JetBrains-Research/opaque"
keywords = ["differential-privacy", "privacy", "dp-sgd"]

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
opt-level = 3
lto = true
# Retain line tables: stripping all debuginfo can create a Mach-O with an
# unaligned LINKEDIT string pool on current Xcode linkers.
debug = 1

# The Monte-Carlo / PLD numerical tests (amplification::*, balls_in_bins) are
# ~10-100x slower at opt-level 0, which made `cargo test` the slowest CI job by
# far (compile was only ~40s; the rest was unoptimized test execution).
# Optimize the test binary and its dependencies. Rust does not enable fast-math,
# so higher opt-levels do not change floating-point results — the accounting
# tolerances are unaffected, and debug-assertions stay on (test-profile default).
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

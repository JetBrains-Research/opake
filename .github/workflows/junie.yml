name: Junie

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  junie:
    if: >-
      !endsWith(github.actor, '[bot]') &&
      (
        (
          github.event_name == 'issue_comment' &&
          (
            contains(github.event.comment.body, '@junie-agent') ||
            contains(github.event.comment.body, '/junie')
          ) &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          (
            contains(github.event.comment.body, '@junie-agent') ||
            contains(github.event.comment.body, '/junie')
          ) &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association
          )
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          (
            contains(github.event.review.body, '@junie-agent') ||
            contains(github.event.review.body, '/junie')
          ) &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.review.author_association
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (
            contains(github.event.issue.body, '@junie-agent') ||
            contains(github.event.issue.title, '@junie-agent') ||
            contains(github.event.issue.body, '/junie') ||
            contains(github.event.issue.title, '/junie')
          ) &&
          contains(
            fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.issue.author_association
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Junie
        uses: JetBrains/junie-github-action@8c442773960f53c76920978f485e0e25a66ef0fb # v1.7.10
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          use_single_comment: "true"
          trigger_phrase: >-
            ${{
              (
                (
                  github.event_name == 'issue_comment' &&
                  contains(github.event.comment.body, '/junie')
                ) ||
                (
                  github.event_name == 'pull_request_review_comment' &&
                  contains(github.event.comment.body, '/junie')
                ) ||
                (
                  github.event_name == 'pull_request_review' &&
                  contains(github.event.review.body, '/junie')
                ) ||
                (
                  github.event_name == 'issues' &&
                  (
                    contains(github.event.issue.body, '/junie') ||
                    contains(github.event.issue.title, '/junie')
                  )
                )
              )
              && '/junie' || '@junie-agent'
            }}

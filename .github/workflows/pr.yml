name: PR gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repo squash-merges, so the PR title becomes the commit message on
  # main. git-cliff groups release-note sections by Conventional Commit
  # type — anything it doesn't recognize lands in the generic "Other"
  # bucket. Keep the accepted-type list here in sync with cliff.toml's
  # `commit_parsers`.
  conventional-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            add
            fix
            refactor
            change
            perf
            deps
            docs
            test
            ci
            build
            chore
            style
            delete
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject after the colon should start with a lowercase letter.

  # ---------------------------------------------------------------------------
  # Rust tests
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust
    uses: ./.github/workflows/rust-tests.yml

  # ---------------------------------------------------------------------------
  # Python tests
  #
  # Every environment calls the same reusable workflow with explicit runner,
  # Python, dependency, marker, parallelism, and explicit suite settings. Slow
  # tests stay on main except for the reviewed CPU/Gloo distributed selection;
  # supported dependency and platform boundaries remain pre-merge.
  # ---------------------------------------------------------------------------
  python-tests-linux-amd64:
    name: Linux amd64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-amd64
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 30

  python-tests-distributed:
    name: Linux amd64 (distributed)
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      environment-name: linux-distributed
      pytest-marker: distributed and not cuda
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 30

  python-tests-minimum:
    name: Linux amd64 (minimum dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: minimum
      environment-name: minimum-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 60

  python-tests-latest:
    name: Linux amd64 (latest dependencies)
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.13"
      report-durations: true
      runner: ubuntu-latest
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: mps
      pytest-marker: not cuda and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      timeout-minutes: 30

  python-tests-linux-arm64:
    name: Linux arm64 (locked)
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      timeout-minutes: 30

  # Fork pull requests must never execute untrusted code on the persistent
  # self-hosted GPU runner. The job-level guard prevents allocation entirely.
  python-tests-cuda:
    name: CUDA (locked)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      environment-name: cuda
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 30

  python-tests-cuda-minimum:
    name: CUDA (minimum dependencies)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      dependency-selection: minimum
      environment-name: cuda-minimum-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.11"
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 60

  python-tests-cuda-latest:
    name: CUDA (latest dependencies)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-empty-test-selection: true
      dependency-selection: latest
      environment-name: cuda-latest-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.13"
      report-durations: true
      runner: GPU-runner-001
      timeout-minutes: 60

  # Keep a stable, matrix-independent check name for branch protection rules.
  # CUDA is intentionally skipped for fork pull requests because the runner is
  # self-hosted and must not execute untrusted code.
  python-tests:
    name: Python tests
    if: ${{ always() }}
    needs:
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-minimum
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
      - python-tests-cuda-minimum
      - python-tests-cuda-latest
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failures="$(
            jq -r '
              to_entries[]
              | select(
                  .value.result != "success"
                  and (
                    .value.result != "skipped"
                    or (.key | startswith("python-tests-cuda") | not)
                  )
                )
              | "\(.key): \(.value.result)"
            ' <<< "$RESULTS"
          )"

          if [[ -n "$failures" ]]; then
            echo "::error::Required Python test jobs did not succeed:"
            echo "$failures"
            exit 1
          fi

  # Like the Python gate above, this is the stable check branch protection
  # should require rather than the reusable workflow's implementation job.
  rust-test-gate:
    name: Rust tests
    if: ${{ always() }}
    needs: [rust-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        env:
          RESULT: ${{ needs.rust-tests.result }}
        shell: bash
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Rust tests finished with result: $RESULT"
            exit 1
          fi

  qodana:
    name: Qodana
    if: >-
      (success() || failure()) &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/qodana.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      coverage-artifact-pattern: coverage-locked-*
      fail-on-problems: true
      pr-mode: true
    secrets: inherit

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-python

      - name: Install documentation dependencies
        run: uv sync --group docs --all-packages

      - name: Build documentation
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Preview wheels. Builds every wheel at a version like
  # `0.2.2.dev3+pr.142.gabc1234` and uploads them as workflow artifacts.
  # Reviewers download from the PR's Actions run page and `pip install`
  # the .whl files locally. Artifacts expire per workflow retention.
  # ---------------------------------------------------------------------------
  compute-preview-version:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            BASE="0.0.1"
            DISTANCE=0
          else
            STRIPPED="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STRIPPED"
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            DISTANCE=$(git rev-list --count "${LAST}..HEAD")
          fi
          SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}.dev${DISTANCE}+pr.${PR_NUMBER}.g${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

  build-preview-distributions:
    name: Build
    needs: [compute-preview-version]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-prefix: preview-wheels
      retention-days: 14
      version: ${{ needs.compute-preview-version.outputs.version }}

  validate-preview-distributions:
    name: Validate
    needs: [build-preview-distributions]
    uses: ./.github/workflows/validate-distributions.yml
    with:
      artifact-prefix: preview-wheels

  merge-preview-wheels:
    name: Merge preview wheels into single artifact
    needs: [build-preview-distributions, validate-preview-distributions]
    runs-on: ubuntu-latest
    steps:
      # Best-effort: merge the per-package wheels into one artifact and delete
      # the sources so a single ``preview-wheels`` is left. ``continue-on-error``
      # tolerates the delete step 404ing when a concurrent/cancelled run
      # (cancel-in-progress on rapid pushes) already removed a source artifact —
      # a flake unrelated to the build. This job is a leaf (nothing depends on
      # the merged artifact), so not gating on it is safe.
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: preview-wheels
          pattern: preview-wheels-*
          delete-merged: true
          retention-days: 14

# Lint & format live in `autoformat.yml`. That workflow auto-applies
# ruff format / ruff check --fix, commits any changes to the PR branch,
# and then verifies the tree is clean. If it pushes a fix, this pr.yml
# re-runs against the amended tip — making lint self-gating without
# duplicating the check here.

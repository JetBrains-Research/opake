name: Auto-format & Lint

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: autoformat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-python:
    name: Format Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python

      # Use the lockfile ruff (not unpinned `uvx ruff`) so CI and local
      # `uv run ruff` stay on the same version. Rule selection lives in
      # pyproject.toml `[tool.ruff.lint]`.
      - name: Install locked ruff
        run: uv sync --group dev --no-install-workspace --frozen

      - name: Check Python formatting and linting
        run: |
          uv run --no-sync ruff format --check packages/ tests/
          uv run --no-sync ruff check packages/ tests/

  format-python-fix:
    name: Auto-fix Python formatting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-python

      - name: Install locked ruff
        run: uv sync --group dev --no-install-workspace --frozen

      - name: Auto-fix Python formatting and linting
        run: |
          uv run --no-sync ruff format packages/ tests/
          uv run --no-sync ruff check --fix packages/ tests/

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "ci: auto-format Python with ruff"
          file_pattern: "packages/**/*.py tests/**/*.py"

  format-rust:
    name: Format Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting and linting
        run: |
          cargo fmt --manifest-path packages/opake-accounting/Cargo.toml -- --check
          cargo clippy --manifest-path packages/opake-accounting/Cargo.toml -- -D warnings

  format-rust-fix:
    name: Auto-fix Rust formatting
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Auto-fix Rust formatting and linting
        run: |
          cargo fmt --manifest-path packages/opake-accounting/Cargo.toml
          cargo clippy --manifest-path packages/opake-accounting/Cargo.toml --fix --allow-dirty --allow-staged

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "ci: auto-format Rust with fmt + clippy"
          file_pattern: "packages/opake-accounting/**/*.rs"
